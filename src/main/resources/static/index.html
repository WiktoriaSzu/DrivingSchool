<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driving School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="container mt-4">
<h1>Driving School Management System</h1>
<button id="fetchStudents" class="btn btn-primary">Load Students</button>
<input type="text" id="nameInput" onkeyup="searchName()" placeholder="Search for student.." title="Type in a name">
<input type="text" id="instructorInput" onkeyup="searchByInstructor()" placeholder="Search by instructor.." title="Type in an instructor">
<table class="table table-striped mt-3">
    <thead>
    <tr>
        <th>Name</th>
        <th>Course Nr</th>
        <th>Instructor</th>
        <th>Hours done sortTable(3)</th>
        <th>Options</th>
    </tr>
    </thead>
    <tbody id="studentTable">
    <!-- Cyborg data will be inserted here dynamically -->
    </tbody>
</table>
<h2>Add Student</h2>
<form id="addStudentForm">
    <input type="hidden" id="addStudentId">
    <div class="mb-2">
        <label>Name:</label>
        <input type="text" id="addStudentName" class="form-control" required>
    </div>
    <div class="mb-2">
        <label>Course Nr:</label>
        <input type="number" id="addStudentCourseNr" class="form-control" required>
    </div>
    <div class="mb-2">
        <label>Instructor:</label>
        <input type="text" id="addStudentInstructor" class="form-control" required>
    </div>
    <div class="mb-2">
        <label>Hours done:</label>
        <input type="number" id="addStudentHoursDone" class="form-control" required>
    </div>
    <button type="submit" id="addStudentButton" class="btn btn-success">Add Student</button>
</form>

<!--    <label for="password">Password</label>-->
<!--    <input type="password" id="password" class="form-control" required>-->
<!--    <button type="submit" id="loginbtn" class="btn btn-success">Log in</button>-->
<!--</form>-->
<div class="modal fade" id="studentsModal" tabindex="-1" aria-labelledby="studentsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Manage Students</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <hr>
                <h6>Update Student</h6>
                <form id="editStudentForm">
                    <input type="hidden" id="editStudentId">
                    <div class="mb-2">
                        <label>Name:</label>
                        <input type="text" id="editStudentName" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Course Nr:</label>
                        <input type="text" id="editStudentCourseNr" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Instructor:</label>
                        <input type="text" id="editStudentInstructor" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Hours done:</label>
                        <input type="number" id="editStudentHoursDone" class="form-control">
                    </div>
                    <button type="submit" id="updateStudentButton" class="btn btn-success d-none">Update Student</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
