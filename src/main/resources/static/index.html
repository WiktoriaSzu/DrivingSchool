<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driving School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Driving School Management System</h1>
<button id="fetchStudents" class="btn btn-primary">Load Students</button>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Course Nr</th>
        <th>Instructor</th>
        <th>Hours done</th>
        <th>Options</th>
    </tr>
    </thead>
    <tbody id="studentTable" class="ds-student-table">
    <!-- Cyborg data will be inserted here dynamically -->
    </tbody>
</table>
<h2>Add / Update Student</h2>
<form id="studentForm">
    <input type="hidden" id="cyborgId">
    <div class="mb-2">
        <label>Name:</label>
        <input type="text" id="studentName" class="form-control" required>
    </div>
    <div class="mb-2">
        <label>Course Nr:</label>
        <input type="number" id="studentCourseNr" class="form-control" required>
    </div>
    <div class="mb-2">
        <label>Instructor:</label>
        <input type="text" id="studentInstructor" class="form-control" required>
    </div>
    <div class="mb-2">
        <label>Hours done:</label>
        <input type="text" id="studentHoursDone" class="form-control" required>
    </div>
    <button type="submit" id="createStudentButton" class="btn btn-success">Add Student</button>
    <button type="submit" id="updateStudentButton" class="btn btn-success d-none">Update Student</button>
    <button type="button" id="cancelStudentEdit" class="btn btn-secondary d-none">Cancel Edit</button>
</form>
<h3>Log in</h3>
<form>
    <label for="username">Username</label>
    <input type="text" id="username" class="form-control" required>
    <label for="password">Password</label>
    <input type="password" id="password" class="form-control" required>
    <button type="submit" id="loginbtn" class="btn btn-success">Log in</button>
</form>
<div class="modal fade" id="instructorssModal" tabindex="-1" aria-labelledby="instructorsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Manage Instructors</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul id="instructorsList" class="list-group">
                    <!-- Enhancements will be listed here -->
                </ul>
                <hr>
                <h6>Add / Update Instructor</h6>
                <form id="enhancementForm">
                    <input type="hidden" id="enhancementId">
                    <input type="hidden" id="cyborgEnhancementId">
                    <div class="mb-2">
                        <label>Name:</label>
                        <input type="text" id="enhancementName" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Description:</label>
                        <input type="text" id="enhancementDescription" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Type:</label>
                        <input type="text" id="enhancementType" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Manufacturer:</label>
                        <input type="text" id="enhancementManufacturer" class="form-control">
                    </div>
                    <button type="submit" id="createInstructorButton" class="btn btn-success">add Instructor</button>
                    <button type="submit" id="updateInstructorButton" class="btn btn-success d-none">Update Instructor</button>
                    <button type="button" id="cancelInstructorEdit" class="btn btn-secondary d-none">Cancel Instructor</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
