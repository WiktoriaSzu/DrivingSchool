spring.application.name=DrivingSchool
spring.datasource.url=jdbc:postgresql://localhost:5432/DrivingSchool
spring.datasource.username=postgres
spring.datasource.password=${databasedrivingschool}
spring.datasource.driver-class-name=org.postgresql.Driver

# AUTHORIZATION
# OAuth2 - Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, profile, email

# Show SQL in console (for debugging)
spring.sql.init.mode=always

# ALLOWED EMAILS (who may log in; comma-separated)
app.allowed-emails=${ALLOWED_EMAILS:}

